name: Build Android APK

on:
  push:
    branches:
      - arena/525e1fc9-cat-catcher
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'game.js'
      - 'style.css'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: |
          sdkmanager --licenses <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          npm install --no-save --package-lock=false @capacitor/core@7.6.9 @capacitor/android@7.6.9 @capacitor/cli@7.6.9
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-catcher-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
